<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Playlist Migrator</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#12151a; --muted:#6b7280; --line:#e3e6ea;
  --accent:#1db954; --warn:#c2410c; --bad:#b91c1c; --chip:#eef1f4;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1216;--card:#171b21;--ink:#e8eaed;--muted:#9aa3ad;--line:#262c34;
        --accent:#1db954;--warn:#fb923c;--bad:#f87171;--chip:#212831;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:0 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
h1{margin:0 0 8px;font-size:17px;letter-spacing:.01em}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:9px;padding:8px 13px;cursor:pointer;min-height:38px}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:transparent;color:#04170c;font-weight:600}
button.small{padding:5px 9px;min-height:0;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}
.bar{height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--muted)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.ok{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.chip.today{background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent);font-weight:600}
.pl{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .grow{flex:1;min-width:0}
.pl .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
input[type=search]{font:inherit;padding:8px 10px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
details{margin-top:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
summary{cursor:pointer;padding:8px 11px;font-size:13.5px;list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";display:inline-block;width:1.1em;color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>.body{padding:0 11px 8px;max-height:340px;overflow:auto}
#log{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:240px;overflow:auto;
  background:var(--bg);border-radius:9px;padding:10px;white-space:pre-wrap;word-break:break-word}
.tk{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.tk:last-child{border-bottom:0}
.tk .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{border:none;border-radius:14px;padding:0;background:var(--card);color:var(--ink);
  width:min(680px,94vw);max-height:86vh}
dialog::backdrop{background:#0008}
.dlg-head{position:sticky;top:0;background:var(--card);padding:14px;border-bottom:1px solid var(--line)}
.dlg-body{padding:14px;overflow:auto;max-height:64vh}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tabs button{font-size:13px;padding:5px 10px;min-height:0}
.tabs button[aria-selected=true]{background:var(--accent);color:#04170c;border-color:transparent}
a{color:var(--accent)}
.err{color:var(--bad);font-size:13px}
body.readonly input[type=checkbox],
body.readonly .pl button[data-act=sync],
body.readonly .pl button[data-act=pause],
body.readonly .pl button[data-act=remove],
body.readonly .tk button,
body.queueonly .pl button[data-act=pause],
body.queueonly .pl button[data-act=remove],
body.queueonly .tk button{display:none}
</style>
</head>
<body>

<header>
  <div class="wrap" style="padding:0">
    <div class="row spread">
      <h1>Playlist Migrator</h1>
      <div class="row">
        <button id="sync" class="small">同期チェック</button>
        <button id="run" class="primary small">今すぐ実行</button>
      </div>
    </div>
    <div class="bar" style="margin-top:8px"><i id="qbar" style="width:0"></i></div>
    <div class="muted" id="qtext" style="margin-top:6px">読み込み中…</div>
  </div>
</header>

<div class="wrap">
  <div class="card" id="ro" hidden>
    <strong>閲覧モード</strong>
    <div class="muted">操作はできません。追加や実行は PC 側から行ってください。</div>
  </div>

  <div class="card" id="runcard" hidden>
    <div class="row spread" style="margin-bottom:8px">
      <strong id="runtitle">実行中…</strong>
      <button class="small" id="hidelog">閉じる</button>
    </div>
    <div id="log"></div>
  </div>

  <div class="card">
    <div class="row spread" style="margin-bottom:6px">
      <strong>プレイリスト</strong>
      <div class="row">
        <button class="small" id="reload">再取得</button>
        <button class="small primary" id="queue" disabled>選択を登録</button>
      </div>
    </div>
    <div class="muted" id="hint"></div>
    <div id="list"></div>
  </div>

  <div class="card">
    <div class="row spread">
      <div>
        <strong>未マッチ・失敗の再試行</strong>
        <div class="muted" id="retryinfo"></div>
      </div>
      <button class="small" id="retry">再試行に戻す</button>
    </div>
  </div>
</div>

<dialog id="detail">
  <div class="dlg-head">
    <div class="row spread">
      <strong id="dtitle"></strong>
      <button class="small" id="dclose">閉じる</button>
    </div>
    <div class="tabs" id="dtabs"></div>
    <input type="search" id="dsearch" placeholder="曲名・アーティストで絞り込み" style="margin-top:9px">
  </div>
  <div class="dlg-body" id="dbody"></div>
</dialog>

<script>
const T = new URLSearchParams(location.search).get('t');
const api = async (path, opts={}) => {
  const url = path + (T ? (path.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(T) : '');
  const r = await fetch(url, {headers:{'Content-Type':'application/json'}, ...opts});
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.status);
  return r.json();
};
const post = (p, body) => api(p, {method:'POST', body: JSON.stringify(body || {})});
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let playlists = [], selected = new Set(), current = null, curStatus = '', logAt = 0;
let role = 'admin', readonly = false, canQueue = true, todayIds = new Set(), perDay = 66;

const STATUS_LABEL = {pending:'未処理', searched:'検索済', added:'追加済',
                      unmatched:'未マッチ', failed:'失敗', removed:'削除済'};

async function loadRole(){
  role = (await api('/api/me')).role;
  readonly = role === 'viewer';
  canQueue = role === 'admin' || role === 'queue';
  document.body.classList.toggle('readonly', readonly);
  document.body.classList.toggle('queueonly', role === 'queue');
  el('ro').hidden = role === 'admin';
  if (role !== 'admin'){
    el('ro').innerHTML = readonly
      ? '<strong>閲覧モード</strong><div class="muted">操作はできません。追加や実行は PC 側から行ってください。</div>'
      : '<strong>登録モード</strong><div class="muted">プレイリストの登録・同期・実行ができます。'
        + '解除や手動修正は PC 側から行ってください。</div>';
  }
  for (const id of ['run','sync','reload','queue']) el(id).hidden = !canQueue;
  el('retry').hidden = role !== 'admin';
}

// Which tracks today's quota will actually reach, across every queued playlist.
async function loadToday(){
  const d = await api('/api/upcoming?limit=400');
  perDay = d.per_day;
  todayIds = new Set(d.tracks.slice(0, perDay).map(t => t.id));
}

async function loadOverview(){
  const o = await api('/api/overview');
  el('qbar').style.width = Math.min(100, o.quota.used / o.quota.budget * 100) + '%';
  el('qtext').textContent =
    `本日 ${o.quota.used}/${o.quota.budget} units · 今日あと ${o.quota.tracks_left_today} 曲 · `
    + `残り ${o.open} 曲` + (o.eta_days ? ` · 完了まで約 ${o.eta_days} 日` : ' · 完了');
  el('run').disabled = o.running || o.quota.tracks_left_today === 0;
  el('run').textContent = o.running ? '実行中…' : '今すぐ実行';
  if (o.running && !readonly) pollLog();
  const c = o.counts || {}, n = (c.unmatched||0) + (c.failed||0);
  el('retryinfo').textContent = n
    ? `未マッチ ${c.unmatched||0} / 失敗 ${c.failed||0} 件。戻すと再検索する（約 ${n*151} units）。`
    : '対象なし。';
  el('retry').disabled = !n;
}

async function loadPlaylists(refresh){
  el('list').innerHTML = '<div class="muted">読み込み中…</div>';
  try {
    const d = await api('/api/playlists' + (refresh ? '?refresh=true' : ''));
    playlists = d.playlists;
    el('hint').textContent = d.hidden_not_owned
      ? `他人が作成した ${d.hidden_not_owned} 件は Spotify の制限で移行できないため非表示。` : '';
    render();
  } catch(e){ el('list').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function fold(id, kind, label, count){
  if (!count) return '';
  return `<details data-id="${esc(id)}" data-kind="${kind}">
    <summary>${label} <span class="chip">${count}</span></summary>
    <div class="body"><div class="muted">読み込み中…</div></div>
  </details>`;
}

function render(){
  el('list').innerHTML = playlists.map(p => {
    const total = p.total ?? 0, done = p.done || 0, c = p.counts || {};
    const waiting = (c.pending || 0) + (c.searched || 0);
    const pct = total ? Math.round(done / total * 100) : 0;
    const badges = [
      p.queued ? `<span class="chip ok">登録済</span>` : '',
      p.stale ? `<span class="chip warn">Spotify側に変更あり</span>` : '',
      p.paused ? `<span class="chip">一時停止</span>` : '',
    ].join(' ');
    return `<div class="pl">
      ${p.queued ? '<div style="width:20px"></div>'
                 : `<input type="checkbox" data-id="${esc(p.id)}" ${selected.has(p.id)?'checked':''}>`}
      <div class="grow">
        <div class="name">${esc(p.name)}</div>
        <div class="muted">${done}/${total} 曲 ${badges}</div>
        ${p.queued ? `<div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>` : ''}
        ${fold(p.id, 'pending,searched', 'これから移行する曲', waiting)}
        ${fold(p.id, 'unmatched', '未マッチの曲', c.unmatched || 0)}
        ${fold(p.id, 'failed', '失敗した曲', c.failed || 0)}
        ${fold(p.id, 'added', '移行済みの曲', done)}
        ${p.queued ? `<div class="row" style="margin-top:8px">
            <button class="small" data-act="detail" data-id="${esc(p.id)}">全曲を検索</button>
            <button class="small" data-act="sync" data-id="${esc(p.id)}">同期</button>
            <button class="small" data-act="pause" data-id="${esc(p.id)}">${p.paused?'再開':'一時停止'}</button>
            <button class="small" data-act="remove" data-id="${esc(p.id)}">解除</button>
            ${p.yt_id ? `<a class="chip" target="_blank" rel="noopener"
               href="https://music.youtube.com/playlist?list=${esc(p.yt_id)}">YouTube で開く</a>` : ''}
          </div>` : ''}
      </div>
    </div>`;
  }).join('') || '<div class="muted">プレイリストなし</div>';

  // `toggle` does not bubble, so each disclosure gets its own lazy loader.
  for (const d of el('list').querySelectorAll('details')){
    d.addEventListener('toggle', () => { if (d.open) fillFold(d); });
  }
}

function trackRow(t, {marker = false} = {}){
  const search = `https://music.youtube.com/search?q=${encodeURIComponent(t.title + ' ' + t.artists)}`;
  const fixable = t.status === 'unmatched' || t.status === 'failed';
  const today = marker && todayIds.has(t.id) ? '<span class="chip today">今日</span> ' : '';
  const yt = t.yt_video_id
    ? ` · <a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${esc(t.yt_video_id)}">動画</a>` : '';
  return `<div class="tk">
    <div class="t">${today}${esc(t.title)}</div>
    <div class="muted">${esc(t.artists)}${t.note ? ' · ' + esc(t.note) : ''}${yt}</div>
    ${fixable ? `<div class="row" style="margin-top:5px">
        <a class="chip" target="_blank" rel="noopener" href="${search}">YouTube で探す</a>
        <button class="small" data-fix="${t.id}">動画IDを指定</button>
        <button class="small" data-skip="${t.id}">スキップ</button>
      </div>` : ''}
  </div>`;
}

async function fillFold(d){
  const body = d.querySelector('.body');
  const {id, kind} = d.dataset;
  try {
    const q = new URLSearchParams({status: kind});
    const r = await api(`/api/queue/${encodeURIComponent(id)}/tracks?${q}`);
    const marker = kind.startsWith('pending');
    body.innerHTML = r.tracks.map(t => trackRow(t, {marker})).join('')
      || '<div class="muted">該当なし</div>';
  } catch(e){ body.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

el('list').addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox]');
  if (!cb) return;
  cb.checked ? selected.add(cb.dataset.id) : selected.delete(cb.dataset.id);
  el('queue').disabled = selected.size === 0;
});

el('list').addEventListener('click', async e => {
  const fix = e.target.closest('button[data-fix]'), skip = e.target.closest('button[data-skip]');
  if (fix || skip){
    const d = e.target.closest('details');
    try {
      if (fix){
        const v = prompt('YouTube の URL か動画 ID を貼り付け');
        if (!v) return;
        await post(`/api/tracks/${fix.dataset.fix}/resolve`, {video: v});
      } else {
        await post(`/api/tracks/${skip.dataset.skip}/skip`, {});
      }
      await fillFold(d); loadOverview();
    } catch(err){ alert(err.message); }
    return;
  }

  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.dataset.id, p = playlists.find(x => x.id === id);
  b.disabled = true;
  try {
    if (b.dataset.act === 'detail') return openDetail(id);
    if (b.dataset.act === 'sync'){
      const r = await post('/api/sync/' + encodeURIComponent(id), {force:true});
      alert(r.changed ? `+${r.added} 追加 / -${r.removed} 削除 / ${r.restored} 復活` : '変更なし');
    }
    if (b.dataset.act === 'pause') await post(`/api/queue/${encodeURIComponent(id)}/pause`, {paused: !p.paused});
    if (b.dataset.act === 'remove'){
      if (!confirm(`「${p.name}」をキューから外す。YouTube 側に追加済みの曲は消えない。進捗記録は削除。`)) return;
      await api('/api/queue/' + encodeURIComponent(id), {method:'DELETE'});
    }
    await refreshAll();
  } catch(err){ alert(err.message); } finally { b.disabled = false; }
});

el('queue').onclick = async () => {
  el('queue').disabled = true;
  try { await post('/api/queue', {ids:[...selected]}); selected.clear(); await refreshAll(); }
  catch(e){ alert(e.message); }
};

el('reload').onclick = () => loadPlaylists(true);

el('sync').onclick = async e => {
  e.target.disabled = true; e.target.textContent = '確認中…';
  try {
    const d = await post('/api/sync', {});
    const changed = Object.values(d.results).filter(r => r.changed);
    alert(changed.length
      ? changed.map(r => `${r.name}: +${r.added} / -${r.removed}`).join('\n') : '全て最新。');
    await refreshAll();
  } catch(err){ alert(err.message); }
  finally { e.target.disabled = false; e.target.textContent = '同期チェック'; }
};

el('retry').onclick = async () => {
  if (!confirm('未マッチ・失敗した曲を再検索対象に戻す。クォータを消費する。')) return;
  const r = await post('/api/retry', {});
  alert(`${r.reset} 曲を戻した（約 ${r.units} units 必要）。`);
  refreshAll();
};

el('run').onclick = async () => {
  el('run').disabled = true;
  logAt = 0; el('log').textContent = ''; el('runcard').hidden = false;
  try { await post('/api/run', {}); pollLog(); }
  catch(e){ alert(e.message); el('run').disabled = false; }
};
el('hidelog').onclick = () => el('runcard').hidden = true;

const ICON = {added:'✓', unmatched:'?', failed:'×', playlist:'▶', quota:'⏸', error:'!'};
async function pollLog(){
  el('runcard').hidden = false;
  const d = await api('/api/run/log?after=' + logAt);
  for (const ev of d.events){
    logAt = Math.max(logAt, ev.at);
    el('log').textContent += `${ICON[ev.kind] || '·'} ${ev.message}\n`;
  }
  el('log').scrollTop = el('log').scrollHeight;
  if (d.active){ el('runtitle').textContent = '実行中…'; setTimeout(pollLog, 1500); return; }
  const s = d.summary;
  el('runtitle').textContent = s
    ? `完了: ${s.added} 曲追加 / 未マッチ ${s.unmatched} / 失敗 ${s.failed} — ${s.outcome}`
    : (d.error || '完了');
  refreshAll();
}

async function openDetail(id, status){
  current = id; curStatus = status ?? curStatus;
  el('dtitle').textContent = playlists.find(x => x.id === id).name;
  const tabs = [['','すべて'],['pending,searched','これから'],['unmatched','未マッチ'],
                ['failed','失敗'],['added','移行済み']];
  el('dtabs').innerHTML = tabs.map(([v,l]) =>
    `<button data-s="${v}" aria-selected="${curStatus===v}">${l}</button>`).join('');
  el('detail').showModal();
  await loadTracks();
}

async function loadTracks(){
  el('dbody').innerHTML = '<div class="muted">読み込み中…</div>';
  const qs = new URLSearchParams({status: curStatus, q: el('dsearch').value});
  const d = await api(`/api/queue/${encodeURIComponent(current)}/tracks?${qs}`);
  el('dbody').innerHTML = d.tracks.map(t => trackRow(t, {marker:true})).join('')
    || '<div class="muted">該当なし</div>';
}

el('dtabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]'); if (!b) return;
  curStatus = b.dataset.s; openDetail(current);
});
el('dsearch').addEventListener('input', () => {
  clearTimeout(window._t); window._t = setTimeout(loadTracks, 250);
});
el('dclose').onclick = () => el('detail').close();
el('dbody').addEventListener('click', async e => {
  const fix = e.target.closest('button[data-fix]'), skip = e.target.closest('button[data-skip]');
  try {
    if (fix){
      const v = prompt('YouTube の URL か動画 ID を貼り付け');
      if (!v) return;
      await post(`/api/tracks/${fix.dataset.fix}/resolve`, {video: v});
    } else if (skip){
      await post(`/api/tracks/${skip.dataset.skip}/skip`, {});
    } else return;
    await loadTracks(); loadOverview();
  } catch(err){ alert(err.message); }
});

async function refreshAll(){
  await loadToday();
  await Promise.all([loadOverview(), loadPlaylists(true)]);
}

(async () => {
  await loadRole();
  await loadToday();
  loadOverview(); loadPlaylists();
})();
setInterval(() => { loadToday().then(loadOverview); }, 30000);
</script>
</body>
</html>
